<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }

    table{
        width: 400px;
        height: 400px;
        border-collapse: collapse;
    }

    td{
        border: 1px solid black;
        padding: 8px;
        text-align: center; /*Alinhamneto horizontal*/
        vertical-align: top; /*Alinhamneto vertical*/
    }

    .numero{
        text-align: right;
    }

</style>
<body>
    <h1>Minha primeira tabela</h1>
            <!--
            Hierrarquia de tabelas (simples)
            TABLE = tabela
                TABLE ROW = linha de tabel;
                TABLE HEADER = cabeçalho de tabela
                TABLE DATA = dados de tabela
            -->
    <table>
        <tr> <!-- Primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!-- Segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- Terceeira linha -->
            <td>A3</td>
            <td class="numero">B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- Quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td class="numero">C4</td>
        </tr>
    </table>
</body>
</html>
